<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Image OCR - Browser Version</title>

    <!-- Tesseract.js Official Browser CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background-color: #f9f9f9;
      }
      .box {
        border: 2px dashed #007bff;
        padding: 25px;
        text-align: center;
        background-color: #fff;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      input[type="file"] {
        margin-bottom: 10px;
      }
      img {
        max-width: 100%;
        max-height: 250px;
        margin-top: 15px;
        border-radius: 4px;
        display: none;
      }
      textarea {
        width: 100%;
        height: 160px;
        margin-top: 10px;
        padding: 12px;
        box-sizing: border-box;
        font-size: 14px;
      }
      button {
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        width: 100%;
      }
      button:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Easy Image OCR Test (Browser)</h1>
    <p>Select an image to extract text directly in your browser:</p>

    <div class="box">
      <input type="file" id="imageInput" accept="image/*" /><br />
      <img id="imagePreview" alt="Preview" />
    </div>

    <button id="runBtn" type="button">Extract Text from Image</button>

    <h3>Extracted Result:</h3>
    <textarea
      id="result"
      placeholder="Extracted text will appear here..."
      readonly
    ></textarea>

    <script>
      const imageInput = document.getElementById("imageInput");
      const imagePreview = document.getElementById("imagePreview");
      const runBtn = document.getElementById("runBtn");
      const resultBox = document.getElementById("result");

      let selectedImageUrl = null;

      // ပုံရွေးလိုက်တဲ့အခါ
      imageInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) {
          selectedImageUrl = URL.createObjectURL(file);
          imagePreview.src = selectedImageUrl;
          imagePreview.style.display = "block";
          resultBox.value =
            "Image loaded successfully! Click 'Extract Text from Image'.";
        }
      });

      // ခလုတ်နှိပ်လိုက်တဲ့အခါ
      runBtn.addEventListener("click", async () => {
        if (!selectedImageUrl) {
          alert("Please choose an image file first!");
          return;
        }

        // Loading state ပြမယ်
        runBtn.disabled = true;
        runBtn.textContent =
          "Processing... Please wait (Downloading language data if first time)";
        resultBox.value = "Reading image and extracting text in browser...";

        try {
          // Tesseract.js browser global object ကို သုံးပြီး စာဖတ်မယ်
          const {
            data: { text },
          } = await Tesseract.recognize(selectedImageUrl, "eng", {
            logger: (m) => {
              console.log(m); // Console ထဲမှာ Progress တွေ ကြည့်လို့ရပါတယ်။
            },
          });

          resultBox.value = text ? text : "No text found in the image.";
        } catch (error) {
          console.error("OCR Error:", error);
          alert("Error: " + error.message);
          resultBox.value = "Error: " + error.message;
        } finally {
          // ခလုတ်ကို မူလအနေအထား ပြန်ပြောင်းမယ်
          runBtn.disabled = false;
          runBtn.textContent = "Extract Text from Image";
        }
      });
    </script>
  </body>
</html>
